name: build-ko (GKI android12-5.10)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  KBRANCH: android12-5.10
  KCOMMIT: fb24cf99ad97          # 目标设备 vermagic: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
  KLOCAL:  ab14313284            # 设备 vermagic 里的 build 号

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup kernel source (精确到设备内核 commit)
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir ksrc && cd ksrc
          git init
          git remote add origin https://android.googlesource.com/kernel/common
          # googlesource 支持按 reachable SHA 拉取; depth 保证 git describe 可用
          for i in 1 2 3 4 5; do
            echo "== fetch attempt $i =="
            if git fetch --depth=600 origin "$KCOMMIT"; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "fetch failed"; exit 1; }
          git checkout "$KCOMMIT"
          git log --oneline -3

      - name: Install toolchain (clang-14 + aarch64 binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu binutils

      - name: Prepare kernel (LOCALVERSION 分层对齐设备)
        run: |
          cd ksrc
          export LOCALVERSION="-${KLOCAL}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-14 gki_defconfig
          ./scripts/config --file .config \
            --set-str LOCALVERSION "-android12-9" \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-14 \
            -j"$(nproc)" prepare modules_prepare

      - name: Build modules
        run: |
          cd ksrc
          export LOCALVERSION="-${KLOCAL}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-14 \
            -j"$(nproc)" M="$GITHUB_WORKSPACE/ko" modules

      - name: Patch vermagic → 设备内核字符串
        run: |
          cd ko
          python3 - << 'EOF'
          import re
          DEVICE = b"vermagic=5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284 SMP preempt mod_unload modversions aarch64"
          for f in ("vts.ko", "vscreen.ko"):
              d = open(f, "rb").read()
              m = re.search(rb"vermagic=[^\x00]+", d)
              assert m, f"no vermagic in {f}"
              old = m.group()
              assert len(DEVICE) <= len(old), f"device vermagic longer than built ({len(DEVICE)} > {len(old)})"
              d = d.replace(old, DEVICE + b"\x00" * (len(old) - len(DEVICE)))
              open(f, "wb").write(d)
              print(f, "patched:", len(old), "->", len(DEVICE), "bytes")
          EOF

      - name: Verify vermagic (与设备不一致直接判失败)
        run: |
          cd ko
          EXPECT='vermagic=5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284 SMP preempt mod_unload modversions aarch64'
          for k in vts.ko vscreen.ko; do
            V=$(strings "$k" | grep -m1 '^vermagic=')
            echo "$k: $V"
            [ "$V" = "$EXPECT" ] || { echo "VERMAGIC MISMATCH"; exit 1; }
          done
          echo "VERMAGIC EXACT MATCH ✅"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-android12-5.10-${{ env.KLOCAL }}
          path: |
            ko/vts.ko
            ko/vscreen.ko
          if-no-files-found: error
