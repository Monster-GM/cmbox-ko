name: build-ko (GKI android12-5.10 @ 5.10.236)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  KTAG: android12-5.10-2025-05_r1     # = 设备内核 5.10.236 (ABI 必须精确匹配)
  KLOCAL: "-android12-9-00003-gfb24cf99ad97-ab14313284"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup kernel source (ACK tag = device 5.10.236)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            echo "== clone attempt $i =="
            rm -rf ksrc
            if git clone --branch "$KTAG" --depth 1 \
                 https://android.googlesource.com/kernel/common ksrc; then
              ok=1; break
            fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "all clone attempts failed"; exit 1; }
          grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" ksrc/Makefile | head -3

      - name: Install toolchain (clang + aarch64 binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Prepare kernel
        run: |
          cd ksrc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang gki_defconfig
          ./scripts/config --file .config \
            --set-str LOCALVERSION "$KLOCAL" \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang \
            -j"$(nproc)" prepare modules_prepare

      - name: Build modules
        run: |
          cd ksrc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang \
            -j"$(nproc)" M="$GITHUB_WORKSPACE/ko" modules

      - name: Verify vermagic
        run: |
          cd ko
          EXPECT="vermagic=5.10.236${KLOCAL} SMP preempt mod_unload modversions aarch64"
          for k in vts.ko vscreen.ko; do
            V=$(strings "$k" | grep -m1 '^vermagic=')
            echo "$k: $V"
            [ "$V" = "$EXPECT" ] || { echo "VERMAGIC MISMATCH (want: $EXPECT)"; exit 1; }
          done
          echo "VERMAGIC EXACT MATCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-5.10.236
          path: |
            ko/vts.ko
            ko/vscreen.ko
          if-no-files-found: error
