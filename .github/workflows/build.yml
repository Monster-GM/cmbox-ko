name: build-ko (GKI android12-5.10)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  KBRANCH: android12-5.10
  KCOMMIT: fb24cf99ad97          # 目标设备 vermagic: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
  KLOCAL:  ab14313284            # 设备 vermagic 里的 build 号

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup kernel source (AOSP common ${{ env.KBRANCH }})
        run: |
          git config --global init.defaultBranch master
          ok=0
          for i in 1 2 3 4 5; do
            echo "== clone attempt $i =="
            rm -rf ksrc
            if git clone --branch "$KBRANCH" --depth 300 \
                 https://android.googlesource.com/kernel/common ksrc; then
              ok=1; break
            fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "all clone attempts failed"; exit 1; }
          cd ksrc
          git checkout "$KCOMMIT" 2>/dev/null \
            || echo "[warn] commit $KCOMMIT not reachable, using branch head"

      - name: Install toolchain (clang-14 + lld)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 lld-14 libarchive-tools
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Prepare kernel (gki_defconfig + LOCALVERSION 对齐设备)
        run: |
          cd ksrc
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          export LOCALVERSION="-${KLOCAL}"
          export CC=clang-14 LD=ld.lld-14 LLVM=1 LLVM_IAS=1
          make ARCH=arm64 gki_defconfig
          ./scripts/config --file .config \
            --set-str LOCALVERSION "-${KLOCAL}" \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL
          make ARCH=arm64 olddefconfig CC=clang-14 LD=ld.lld-14 LLVM=1 LLVM_IAS=1
          make ARCH=arm64 -j"$(nproc)" prepare modules_prepare \
            CC=clang-14 LD=ld.lld-14 LLVM=1 LLVM_IAS=1

      - name: Build modules
        run: |
          cd ksrc
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          export LOCALVERSION="-${KLOCAL}"
          export CC=clang-14 LD=ld.lld-14 LLVM=1 LLVM_IAS=1
          make ARCH=arm64 -j"$(nproc)" M="$GITHUB_WORKSPACE/ko" modules

      - name: Verify vermagic (必须与设备一致)
        run: |
          cd ko
          for k in vts.ko vscreen.ko; do
            [ -f "$k" ] || continue
            echo "== $k =="
            strings "$k" | grep -m1 "vermagic=" || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-android12-5.10-${{ env.KLOCAL }}
          path: |
            ko/vts.ko
            ko/vscreen.ko
          if-no-files-found: error
